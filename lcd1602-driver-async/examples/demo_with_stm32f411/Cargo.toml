[package]
name = "demo_with_stm32f411"
authors = ["eZioPan <eziopan@qq.com>"]
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
embassy-stm32 = { version = "0.5.0", features = ["stm32f411re", "time", "time-driver-any", "exti", "memory-x"] }
embassy-executor = { version = "0.9", features = ["arch-cortex-m"] }
embassy-time = "0.5"

cortex-m = "0.7"
cortex-m-rt = "0.7"

defmt = "0.3"
defmt-rtt = "0.3"
panic-probe = "0.3"

embedded-hal-async = "1"

lcd1602-driver-async = { path = "../.." }
